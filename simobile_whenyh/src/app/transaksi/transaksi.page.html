<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>DAFTAR TRANSAKSI</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">TRANSAKSI</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-card *ngFor="let t of daftarTransaksi; let i =index" button="true" routerLink="/detail-transaksi/{{ i }}">
    <ion-card-header>
      <ion-card-subtitle>{{ t.tanggal }}</ion-card-subtitle>
      <ion-card-title>Item yang dibeli :</ion-card-title>
    </ion-card-header>

    <ion-card-content>
      <ion-list lines="none">
        <ion-item *ngFor="let item of t.items">
          <ion-label>
            {{ item.nama }} {{ item.jumlah }} : Rp {{ item.harga }}
          </ion-label>
        </ion-item>
      </ion-list>

      <div style="margin-top: 10px; font-weight: bold;">
        Total harga: Rp {{ t.totalHarga }}
      </div>
    </ion-card-content>
  </ion-card>
</ion-content>
