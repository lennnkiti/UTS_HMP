<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>PRODUK</ion-title>


    <ion-buttons slot="end">
      <ion-button id = "btnKeranjang" routerLink="/keranjang">
        <ion-icon slot="icon-only" name="cart-outline"></ion-icon>
        <ion-badge *ngIf="getJumlahJenisKeranjang() > 0" color="danger" style="position: absolute; top: -5px; right: -5px; font-size: 10px;">
          {{ getJumlahJenisKeranjang() }}
        </ion-badge>
      </ion-button>
      <ion-button routerLink="/tambah-produk">
        <ion-icon slot="icon-only" name="add-circle"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-item class="ion-margin-bottom">
    <ion-icon name="search-outline" slot="start"></ion-icon>
    <ion-input label="Cari Barang" labelPlacement="floating" placeholder="Ketik nama produk..."
      [(ngModel)]="searchQuery">
    </ion-input>
  </ion-item>
  <ion-list>
    <ion-list-header>
      <ion-label>Filter Kategori</ion-label>
    </ion-list-header>

    <ion-radio-group [(ngModel)]="selectedCategory">

      <div style="display: flex; padding-bottom: 10px;">
        <ion-item lines="none" style=" margin-right: 5px;">
          <ion-radio value="Semua" slot="start"></ion-radio>
          <ion-label style="font-size: 14px;">Semua</ion-label>
        </ion-item>

        <ion-item lines="none" style="margin-right: 5px;">
          <ion-radio value="Makanan" slot="start"></ion-radio>
          <ion-label style="font-size: 14px;">Makanan</ion-label>
        </ion-item>

        <ion-item lines="none" style="margin-right: 5px;">
          <ion-radio value="Minuman" slot="start"></ion-radio>
          <ion-label style="font-size: 14px;">Minuman</ion-label>
        </ion-item>

        <ion-item lines="none" style="margin-right: 5px;">
          <ion-radio value="Sembako" slot="start"></ion-radio>
          <ion-label style="font-size: 14px;">Sembako</ion-label>
        </ion-item>

        <ion-item lines="none" style="margin-right: 5px;">
          <ion-radio value="Bumbu" slot="start"></ion-radio>
          <ion-label style="font-size: 14px;">Bumbu</ion-label>
        </ion-item>

        <ion-item lines="none" style="margin-right: 15px;">
          <ion-radio value="Kebutuhan Mandi" slot="start"></ion-radio>
          <ion-label style="font-size: 14px;">Kebutuhan Mandi</ion-label>
        </ion-item>
      </div>
    </ion-radio-group>
  </ion-list>

  <ion-grid>
    <ion-row *ngFor="let barisProduk of chunkArray(getFilteredProduk(), 2)">
      <ion-col *ngFor="let p of barisProduk">
        <ion-card class="kartuProduk" >
          <img [src]="p.gambar === '' ? 'https://ionicframework.com/docs/img/demos/thumbnail.svg' : p.gambar"
            routerLink="/details/{{ p.id }}" style="height: 350px; object-fit: cover; width: 100%;" />
          <ion-card-header>
            <ion-card-title style="font-size: 14px;" routerLink="/details/{{ p.id }}">
              {{ p.nama }}
            </ion-card-title>
            <ion-card-subtitle>Rp {{ p.harga_jual }}</ion-card-subtitle>
          </ion-card-header>
          <ion-card-content>
            <p>Stok: {{ p.stok }}</p>

            
              <div *ngIf="getJumlahDiKeranjang(p.id) > 0" style="display: flex; align-items: center; justify-content: flex-end;">
                <ion-button size ="small" color="light" (click)="kurangiDariKeranjang(p)">
                  <ion-icon slot="icon-only" name="remove-outline"></ion-icon>
                </ion-button>
                <ion-input type="number" [value]="keranjangItem(p.id).jumlah" readonly
                  style="width: 55px; text-align: center; border: 1px solid #ccc; border-radius: 5px; margin: 0 10px;">
                </ion-input>
                <ion-button size="small" color="light" [disabled]="getJumlahDiKeranjang(p.id) >= p.stok" (click)="tambahKeKeranjang(p)">
                  <ion-icon slot="icon-only" name="add-outline"></ion-icon>
                </ion-button>
              </div>
            <ion-button *ngIf="getJumlahDiKeranjang(p.id) === 0" expand="block" size="small" [disabled]="p.stok == 0" (click)="tambahKeKeranjang(p)">
              + Keranjang
            </ion-button>
            

            <ion-button expand="block" size="small" color="danger" routerLink="/edit-produk/{{ p.id }}">
              <ion-icon slot="start" name="create-outline"></ion-icon>
              Edit Produk
            </ion-button>
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>
  <ion-alert [isOpen]="tampilkanAlert" header="Berhasil" message="Barang berhasil ditambahkan ke keranjang" [buttons]="alertButtons" (didDismiss)="tampilkanAlert = false"></ion-alert>
</ion-content>
