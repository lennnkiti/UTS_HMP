<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>PROFILE</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">

  <div *ngIf="auth.activeUser" id="frame">
    <ion-avatar>
      <ion-img src="{{ auth.activeUser.foto }}"></ion-img>
    </ion-avatar>
  </div>

  <ion-card class="agaknaik">
    <ion-card-header class="tengahatas">
      <ion-card-title class="nama">{{ auth.activeUser.nama }}</ion-card-title>
      <ion-card-subtitle>{{ auth.activeUser.role }}</ion-card-subtitle>
    </ion-card-header>

    <ion-card-content>
      <ion-list lines="inset">

        <ion-item>
          <ion-icon name="person-outline" slot="start" color="primary"></ion-icon>
          <ion-label>
            <h3>Nama</h3>
            <p>{{ auth.activeUser.nama }}</p>
          </ion-label>
        </ion-item>

        <ion-item>
          <ion-icon name="location-outline" slot="start" color="primary"></ion-icon>
          <ion-label class="ion-text-wrap">
            <h3>Alamat</h3>
            <p>{{ auth.activeUser.alamat }}</p>
          </ion-label>
        </ion-item>

        <ion-item>
          <ion-icon name="calendar-outline" slot="start" color="primary"></ion-icon>
          <ion-label class="ion-text-wrap">
            <h3>Tempat, Tanggal Lahir</h3>
            <p>{{ auth.activeUser.ttl}}</p>
          </ion-label>
        </ion-item>

        <ion-item>
          <ion-icon name="call-outline" slot="start" color="primary"></ion-icon>
          <ion-label>
            <h3>No Telp</h3>
            <p>{{ auth.activeUser.noTelp }}</p>
          </ion-label>
        </ion-item>

        <ion-item lines="none">
          <ion-icon name="mail-outline" slot="start" color="primary"></ion-icon>
          <ion-label>
            <h3>Email</h3>
            <p>{{ auth.activeUser.email }}</p>
          </ion-label>
        </ion-item>

      </ion-list>
    </ion-card-content>
  </ion-card>
</ion-content>
