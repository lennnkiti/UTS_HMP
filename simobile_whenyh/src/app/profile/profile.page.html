<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>PROFILE</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">PROFILE</ion-title>
    </ion-toolbar>
  </ion-header>

  <div id="frame">
    <ion-avatar>
      <ion-img src="https://my.ubaya.ac.id/img/mhs/160424028_l.jpg"></ion-img>
    </ion-avatar>
  </div>

  <ion-card class="agaknaik">
    <ion-card-header class="tengahatas">
      <ion-card-title class="nama">{{ namaPemilik }}</ion-card-title>
      <ion-card-subtitle>Toko Makmur Jaya</ion-card-subtitle>
    </ion-card-header>

    <ion-card-content>
      <ion-list lines="inset">

        <ion-item>
          <ion-icon name="person-outline" slot="start" color="primary"></ion-icon>
          <ion-label>
            <h3>Nama Pemilik</h3>
            <p>{{ namaPemilik }}</p>
          </ion-label>
        </ion-item>

        <ion-item>
          <ion-icon name="business-outline" slot="start" color="primary"></ion-icon>
          <ion-label>
            <h3>Tanggal Usaha Dibangun</h3>
            <p>{{ tanggalUsahaDibangun }}</p>
          </ion-label>
        </ion-item>

        <ion-item>
          <ion-icon name="location-outline" slot="start" color="primary"></ion-icon>
          <ion-label class="ion-text-wrap">
            <h3>Alamat Usaha</h3>
            <p>{{ alamatUsaha }}</p>
          </ion-label>
        </ion-item>

        <ion-item>
          <ion-icon name="calendar-outline" slot="start" color="primary"></ion-icon>
          <ion-label class="ion-text-wrap">
            <h3>Tempat, Tanggal Lahir</h3>
            <p>{{ ttl }}</p>
          </ion-label>
        </ion-item>

        <ion-item>
          <ion-icon name="call-outline" slot="start" color="primary"></ion-icon>
          <ion-label>
            <h3>No Telp :</h3>
            <p>{{ noTelp }}</p>
          </ion-label>
        </ion-item>

        <ion-item lines="none">
          <ion-icon name="mail-outline" slot="start" color="primary"></ion-icon>
          <ion-label>
            <h3>Email :</h3>
            <p>{{ email }}</p>
          </ion-label>
        </ion-item>

      </ion-list>
    </ion-card-content>
  </ion-card>
</ion-content>
